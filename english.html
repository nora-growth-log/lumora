<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Từ vựng · Nora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning, same family as Nora's My Life Dashboard
   IDEA a pastel sticker notebook on dotted paper: tinted cards, one colour per section
   PICTURE the blob mascot on the pink home card, and the live exercise card in sessions
   COLOUR dashboard palette: dotted #FFF5FA ground, ink #4A3856, tints pink/mint/sky/lemon/lilac/peach with deep accents, brand #E0588C
   TYPE Baloo 2 display + Nunito text
   LAYOUT phone: hero, 4 stat tiles, 3 big actions, bottom tabs; laptop: same in a 960px column */
:root{color-scheme:light;
--bg:#FFF5FA;--card:#FFFFFF;--ink:#4A3856;--soft:#8A7896;--line:#F1DCEA;--brand:#E0588C;
--pink:#FFDDEA;--pinkD:#E0588C;--mint:#D3F4E4;--mintD:#2A9A6E;--sky:#D7EAFF;--skyD:#3B7DD6;
--butter:#FFF2C4;--butterD:#A87900;--lav:#E9DEFF;--lavD:#7A58D6;--peach:#FFE3D1;--peachD:#CC6830;
--ok:#D3F4E4;--bad:#FFDDEA}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--line) 1.5px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:"Baloo 2",Nunito,system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,7vw,42px);color:var(--brand);font-weight:800}h2{font-size:26px;color:var(--lavD)}h3{font-size:20px;color:var(--lavD)}
.wrap{max-width:960px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 110px}
.muted{color:var(--soft)}.small{font-size:13px}
.card{background:var(--card);border-radius:22px;border:2px solid var(--line);padding:18px;box-shadow:0 4px 0 rgba(74,56,86,.06)}
.btn{--cd:var(--mintD);font:800 16px/1 Nunito,system-ui,sans-serif;border:0;border-radius:99px;padding:14px 20px;min-height:50px;cursor:pointer;color:#fff;background:var(--cd);box-shadow:0 4px 0 color-mix(in srgb,var(--cd) 70%,#000);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--cd) 70%,#000)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.tile:focus-visible,.spk:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--lavD);outline-offset:3px}
.btn.peach{--cd:var(--pinkD)}.btn.butter{--cd:var(--butterD)}.btn.lav{--cd:var(--lavD)}.btn.sky{--cd:var(--skyD)}.btn.pink{--cd:var(--pinkD)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.spk{border:0;background:var(--sky);color:var(--skyD);width:40px;height:40px;border-radius:50%;cursor:pointer;flex:none;display:inline-grid;place-items:center}
.spk svg{width:20px;height:20px}
input,textarea,select{font:16px/1.4 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--lavD)}
textarea{resize:vertical;min-height:90px}
label{font-weight:800;display:block;margin:12px 0 6px;color:var(--soft)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;align-items:center;background:var(--pink);border:0;position:relative;overflow:hidden}
.hero .mas{width:150px;height:150px}
.hero p{margin:6px 0 0;font-weight:700}
.hero .date{color:var(--lavD);font-weight:800;font-size:14px;margin:0 0 4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.stat{border-radius:18px;padding:12px;display:grid;box-shadow:0 4px 0 rgba(74,56,86,.06)}
.stat b{display:block;font:800 28px/1.1 "Baloo 2",Nunito,sans-serif;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:700;color:var(--soft)}
.stat.s1{background:var(--peach)}.stat.s1 b{color:var(--peachD)}
.stat.s2{background:var(--butter)}.stat.s2 b{color:var(--butterD)}
.stat.s3{background:var(--sky)}.stat.s3 b{color:var(--skyD)}
.stat.s4{background:var(--mint)}.stat.s4 b{color:var(--mintD)}
.acts{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
.act{border-radius:22px;flex-direction:column;min-height:120px;font-size:18px;text-align:center;line-height:1.2;padding:16px 10px;background:var(--c);color:var(--cd);box-shadow:0 4px 0 rgba(74,56,86,.08)}
.act:active{box-shadow:0 1px 0 rgba(74,56,86,.08)}
.act.a1{--c:var(--mint);--cd:var(--mintD)}.act.a2{--c:var(--lav);--cd:var(--lavD)}.act.a3{--c:var(--peach);--cd:var(--peachD)}
.act span{font-family:"Baloo 2",Nunito,sans-serif;font-weight:800}
.act small{display:block;font:700 13px Nunito,sans-serif;color:var(--soft)}
.act svg{width:34px;height:34px}
.next{display:flex;gap:12px;align-items:center;margin-top:16px}
.next .mas{width:64px;height:64px;flex:none}
.bar{height:14px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pinkD);border-radius:9px}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.iconbtn{border:2px solid var(--line);background:var(--card);color:var(--lavD);border-radius:50%;width:46px;height:46px;cursor:pointer;display:grid;place-items:center;font-weight:800}
.iconbtn svg{width:22px;height:22px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,245,250,.92);backdrop-filter:blur(6px);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{border:0;background:none;color:var(--soft);font:800 13px Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:16px;cursor:pointer;min-height:54px}
.tab svg{width:26px;height:26px}
.tab.on{color:#fff;background:var(--cd)}
#t-home{--cd:var(--pinkD)}#t-words{--cd:var(--mintD)}#t-mist{--cd:var(--peachD)}#t-stk{--cd:var(--lavD)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:0;background:rgba(255,255,255,.8);color:var(--soft);border-radius:99px;padding:8px 14px;font:800 14px Nunito,sans-serif;cursor:pointer;min-height:40px}
.chip.on{background:var(--mintD);color:#fff}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))}
.row{display:flex;gap:10px;align-items:center}
.row .grow{flex:1}
.w{font:800 19px/1.15 "Baloo 2",Nunito,sans-serif;color:var(--ink)}
.pill{font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;white-space:nowrap;color:var(--ink)}
.sent{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:2px dashed var(--line)}
.sent p{margin:0}
details summary{cursor:pointer;font-weight:800;list-style:none}
details summary::-webkit-details-marker{display:none}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.stk{text-align:center;padding:14px 10px}
.stk .mas{width:96px;height:96px;margin:0 auto}
.stk.lock .mas{opacity:.28;filter:grayscale(1)}
.stk b{display:block;font:800 17px "Baloo 2",sans-serif;margin-top:4px;color:var(--lavD)}
.ov{position:fixed;inset:0;background-color:var(--bg);background-image:radial-gradient(var(--line) 1.5px,transparent 1.6px);background-size:22px 22px;z-index:10;display:flex;flex-direction:column;overflow:auto}
.ovhead{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-left,0px));max-width:760px;width:100%;margin:0 auto}
.ovhead .bar{flex:1;height:16px;margin:0}
.ovhead .bar i{background:var(--mintD);transition:width .3s}
.ovbody{flex:1;max-width:760px;width:100%;margin:0 auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:14px}
.kind{font-weight:800;color:var(--lavD);font-size:14px}
.q{font:700 22px/1.35 Nunito,sans-serif}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--pinkD);margin:0 4px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{justify-content:flex-start;text-align:left;font-size:16px;line-height:1.3;border-radius:18px}
.opt.sel{background:var(--lav);border-color:var(--lavD);color:var(--lavD)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border-radius:16px}
.ans{border:2px dashed var(--lavD);background:rgba(255,255,255,.7)}
.tile{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;font:800 16px Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--line);min-height:44px}
.tile.used{visibility:hidden}
.flip{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;background:var(--sky);border:0}
.flip .w{font-size:34px;color:var(--skyD)}
.flip .disp{color:var(--ink)}
.foot{position:sticky;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(255,245,250,.95);border-top:2px solid var(--line)}
.foot .in{max-width:760px;margin:0 auto;display:grid;gap:10px}
.fb{border-radius:18px;padding:12px 14px;font-weight:700}
.fb.ok{background:var(--mint)}.fb.ok b{color:var(--mintD)}.fb.bad{background:var(--pink)}.fb.bad b{color:var(--pinkD)}
.fb b{font:800 20px "Baloo 2",sans-serif;display:block}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-size:13px;font-weight:800;border-radius:99px;padding:4px 10px}
.key.y{background:var(--mint);color:var(--mintD)}.key.n{background:var(--pink);color:var(--pinkD)}
.psent{display:grid;gap:8px;padding:12px 0;border-top:2px dashed var(--line)}
.mine{text-decoration:line-through;text-decoration-color:var(--pinkD)}
.note{background:var(--butter);border:0}
.note b{color:var(--butterD)}
.modal{position:fixed;inset:0;background:rgba(74,56,86,.4);z-index:20;display:grid;place-items:center;padding:16px}
.modal .card{max-width:420px;width:100%;text-align:center}
.modal .mas{width:150px;height:150px;margin:0 auto}
.conf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{50%{transform:translateY(-6px) scale(1.02,.98)}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}}
@media(prefers-reduced-motion:reduce){.bob,.pop,.conf i{animation:none}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;z-index:40;max-width:90vw}
@media(max-width:600px){
.hero{grid-template-columns:minmax(0,1fr) 110px}.hero .mas{width:110px;height:110px}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.acts{grid-template-columns:1fr}.act{flex-direction:row;min-height:64px;justify-content:flex-start;text-align:left;gap:14px}
.opts{grid-template-columns:1fr}
.q{font-size:20px}}
.appnav{position:sticky;top:0;z-index:8;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px);background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-bottom:2px solid rgba(0,0,0,.05)}.appnav a{font:700 14px/1 "Nunito","Be Vietnam Pro",system-ui,sans-serif;text-decoration:none;color:#8A7896;padding:10px 16px;border-radius:99px;min-height:40px;display:inline-flex;align-items:center}.appnav a.on{color:#fff;background:#E0588C}.appnav a.on.x{background:#1F6B32}</style>
</head>

<script>
{
const SAMPLE={"lesson":"Bài mẫu: 6 cụm từ kinh tế","words":[
{"w":"cut costs","pos":"cụm động từ","vi":"cắt giảm chi phí","s":[
{"en":"We need to cut costs this year.","vi":"Chúng ta cần cắt giảm chi phí năm nay.","ans":"cut costs","lvl":1},
{"en":"The company cut costs by closing two stores.","vi":"Công ty đã cắt giảm chi phí bằng cách đóng cửa hai cửa hàng.","ans":"cut costs","lvl":1},
{"en":"How can we cut costs without firing staff?","vi":"Làm sao để cắt giảm chi phí mà không sa thải nhân viên?","ans":"cut costs","lvl":1},
{"en":"Many firms are cutting costs because of high inflation.","vi":"Nhiều công ty đang cắt giảm chi phí vì lạm phát cao.","ans":"cutting costs","lvl":2},
{"en":"The manager asked every department to cut costs by 10%.","vi":"Quản lý yêu cầu mọi phòng ban cắt giảm chi phí 10%.","ans":"cut costs","lvl":2},
{"en":"Costs were cut after the merger.","vi":"Chi phí đã được cắt giảm sau vụ sáp nhập.","ans":"were cut","lvl":2},
{"en":"Airlines cut costs aggressively when fuel prices rose sharply.","vi":"Các hãng hàng không cắt giảm chi phí mạnh tay khi giá nhiên liệu tăng mạnh.","ans":"cut costs","lvl":3},
{"en":"If we don't cut costs, our profit margin will shrink.","vi":"Nếu không cắt giảm chi phí, biên lợi nhuận của chúng ta sẽ thu hẹp.","ans":"cut costs","lvl":3},
{"en":"Cutting costs too quickly can hurt product quality.","vi":"Cắt giảm chi phí quá nhanh có thể làm giảm chất lượng sản phẩm.","ans":"Cutting costs","lvl":3},
{"en":"The new software helped the firm cut costs while increasing output.","vi":"Phần mềm mới giúp công ty cắt giảm chi phí trong khi vẫn tăng sản lượng.","ans":"cut costs","lvl":3}]},
{"w":"raise interest rates","pos":"cụm động từ","vi":"tăng lãi suất","s":[
{"en":"The central bank may raise interest rates next month.","vi":"Ngân hàng trung ương có thể tăng lãi suất vào tháng tới.","ans":"raise interest rates","lvl":1},

{"en":"Raising interest rates can help reduce inflation.","vi":"Tăng lãi suất có thể giúp giảm lạm phát.","ans":"Raising interest rates","lvl":2},

{"en":"If the bank raises interest rates, borrowing costs will go up.","vi":"Nếu ngân hàng tăng lãi suất, chi phí vay sẽ tăng.","ans":"raises interest rates","lvl":2},
{"en":"Investors are worried that the central bank will raise interest rates again.","vi":"Các nhà đầu tư lo ngại ngân hàng trung ương sẽ lại tăng lãi suất.","ans":"raise interest rates","lvl":3},
{"en":"The decision to raise interest rates surprised the stock market.","vi":"Quyết định tăng lãi suất đã khiến thị trường chứng khoán bất ngờ.","ans":"raise interest rates","lvl":3},
{"en":"Analysts expect the State Bank of Vietnam not to raise interest rates this year.","vi":"Các nhà phân tích dự đoán Ngân hàng Nhà nước Việt Nam sẽ không tăng lãi suất trong năm nay.","ans":"raise interest rates","lvl":3},
{"en":"Raising interest rates too fast could slow down economic growth.","vi":"Tăng lãi suất quá nhanh có thể làm chậm tăng trưởng kinh tế.","ans":"Raising interest rates","lvl":3}]},
{"w":"revenue","pos":"danh từ","vi":"doanh thu","s":[

{"en":"The new product line generated more revenue than expected.","vi":"Dòng sản phẩm mới tạo ra nhiều doanh thu hơn dự kiến.","ans":"revenue","lvl":2},
{"en":"Although revenue increased, net profit decreased because of higher costs.","vi":"Mặc dù doanh thu tăng, lợi nhuận ròng lại giảm do chi phí cao hơn.","ans":"revenue","lvl":3},
{"en":"Tourism is a major source of revenue for the city.","vi":"Du lịch là một nguồn doanh thu lớn của thành phố.","ans":"revenue","lvl":3},

function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}

function blankState(){return{words:[],paras:[],mistakes:[],log:{},stickers:{},settings:{newPerDay:8,maxRev:60,rate:.9},stats:{sessions:0,paras:0,fixed:0}}}

function logT(){const t=today();return S.log[t]||(S.log[t]={rev:0,nw:0,para:0,done:false})}

function importData(st,data){
 const res={words:0,sent:0,paras:0};
 (data.words||[]).forEach(x=>{if(!x||!x.w)return;
  let w=st.words.find(o=>norm(o.w)===norm(x.w));
  if(!w){w={id:uid(),w:String(x.w).trim(),vi:x.vi||'',pos:x.pos||'',src:data.lesson||'',s:[],ivl:0,ease:2.5,reps:0,lapses:0,due:null,intro:false,last:'',added:today()};st.words.push(w);res.words++}
  else if(x.vi&&!w.vi)w.vi=x.vi;
  (x.s||[]).forEach(s=>{if(!s||!s.en)return;if(w.s.some(o=>norm(o.en)===norm(s.en)))return;
   let ans=s.ans&&s.en.toLowerCase().includes(String(s.ans).toLowerCase())?s.ans:(s.en.toLowerCase().includes(w.w.toLowerCase())?w.w:'');
   w.s.push({en:s.en,vi:s.vi||'',ans,lvl:Math.min(3,Math.max(1,+s.lvl||1)),used:0});res.sent++})});
 const p=data.para;if(p&&Array.isArray(p.vi)&&p.vi.length){st.paras.push({id:uid(),title:p.title||data.lesson||'Đoạn dịch',vi:p.vi.slice(0,5),en:(p.en||[]).slice(0,5),k:(p.k||[]).slice(0,5),done:null,mine:null});res.paras++}
 return res}

const mastered=()=>S.words.filter(w=>w.ivl>=21).length;
function streak(){let t=today(),n=0;if(!(S.log[t]&&S.log[t].done))t--;while(S.log[t]&&S.log[t].done){n++;t--}return n}
const dueWords=()=>S.words.filter(w=>w.intro&&w.due<=today());
const newWords=()=>S.words.filter(w=>!w.intro);
function caps(){const L=S.log[today()]||{rev:0,nw:0};return{rev:Math.max(0,S.settings.maxRev-L.rev),nw:Math.max(0,S.settings.newPerDay-L.nw)}}
function counts(){const c=caps();return{due:Math.min(dueWords().length,c.rev),nw:Math.min(newWords().length,c.nw),mis:S.mistakes.filter(m=>!m.ok&&m.due<=today()).length}}
const lowWords=()=>S.words.filter(w=>w.s.length&&w.s.filter(s=>!s.used).length<=2&&w.intro);
const todayPara=()=>S.paras.find(p=>!p.done)||null;
function stv(k){return k==='mastered'?mastered():k==='streak'?streak():S.stats[k]||0}

/* ---------- review session ---------- */
let sess=null;
function pickSent(w){if(!w.s.length)return -1;const max=Math.min(3,1+Math.floor(w.reps/2));
 let cand=w.s.map((s,i)=>i).filter(i=>w.s[i].lvl<=max);if(!cand.length)cand=w.s.map((s,i)=>i);
 const mu=Math.min(...cand.map(i=>w.s[i].used));return pick(cand.filter(i=>w.s[i].used===mu))}
function pickType(w,s,ls){let pool=ls?['mc','order','cloze']:w.reps===0?['flip','mc','order']:w.reps<3?['mc','cloze','order','recall']:w.reps<5?['cloze','order','recall','trans']:['trans','cloze','recall','trans'];
 if(!s)pool=['flip','recall'];else if(!s.ans)pool=pool.map(t=>t==='mc'||t==='cloze'?'order':t);
 const p=pool.filter(t=>t!==w.last);return pick(p.length?p:pool)}
function buildSession(){const c=caps();
 const due=dueWords().sort((a,b)=>a.due-b.due).slice(0,Math.min(c.rev,25));
 const nw=newWords().slice(0,Math.min(c.nw,Math.max(0,25-due.length)));
 const items=[];
 nw.forEach(w=>items.push({wid:w.id,nw:true}));
 const rest=shuffle(due.map(w=>({wid:w.id})).concat(S.mistakes.filter(m=>!m.ok&&m.due<=today()).slice(0,3).map(m=>({mid:m.id}))));
 // interleave: new words spread across
 const out=[];rest.forEach((x,i)=>{out.push(x);if(items.length&&i%2===1)out.push(items.shift())});out.push(...items);
 return out}
function startReview(){const it=buildSession();if(!it.length){toast('Hôm nay hết thẻ rồi!');return}
 sess={items:it,i:0,total:it.length,right:0,graded:0,newCount:0};nextItem()}
function prep(item){if(item.mid){item.type='mis';return}
 const w=S.words.find(x=>x.id===item.wid);if(!w){item.skip=true;return}
 if(item.si===undefined){item.si=pickSent(w);item.type=item.nw&&!item.retry?'flip':pickType(w,w.s[item.si],item.learnStep)}
 if(item.type==='mc'){const s=w.s[item.si];const others=shuffle(S.words.filter(o=>o.id!==w.id).flatMap(o=>o.s.map(x=>x.ans).filter(Boolean)));
  const opts=[s.ans];for(const o of others){if(opts.length>=4)break;if(!opts.some(x=>norm(x)===norm(o)))opts.push(o)}
  if(opts.length<2){item.type='cloze'}else item.opts=shuffle(opts)}
 if(item.type==='order'){const s=w.s[item.si];item.toks=s.en.split(/\s+/).map((t,i)=>({t,i}));let sh=shuffle(item.toks);let k=0;while(sh.length>1&&sh.every((x,i)=>x.i===i)&&k++<5)sh=shuffle(item.toks);item.sh=sh;item.built=[]}}
function nextItem(){if(!sess)return;if(sess.i>=sess.items.length){finish();return}
 const item=sess.items[sess.i];prep(item);if(item.skip){sess.i++;nextItem();return}
 item.state='ask';drawItem()}
function head(){const pc=Math.round(sess.i/sess.items.length*100);return`<div class="ovhead"><button class="iconbtn" data-act="quit" aria-label="Thoát">✕</button><div class="bar"><i style="width:${pc}%"></i></div><span class="small muted"><b>${sess.i+1}/${sess.items.length}</b></span></div>`}
function blankify(en,ans){const i=en.toLowerCase().indexOf(ans.toLowerCase());return i<0?esc(en):esc(en.slice(0,i))+'<span class="blank">&nbsp;</span>'+esc(en.slice(i+ans.length))}
function drawItem(){const item=sess.items[sess.i];let body='',foot='';
 if(item.type==='mis'){const m=S.mistakes.find(x=>x.id===item.mid);
  body=`<div class="kind">Sổ lỗi · Dịch lại câu này sang tiếng Anh</div><div class="q">${esc(m.vi)}</div><textarea id="ta" placeholder="Viết câu tiếng Anh…" ${item.state!=='ask'?'disabled':''}>${esc(item.val||'')}</textarea>`;
  if(item.state==='ask')foot=`<button class="btn wide" data-act="check">Xem câu mẫu</button>`;
  else{body+=`<div class="card"><div class="small muted">Câu mẫu</div><div class="row" style="margin-top:6px">${spk(m.model)}<b>${esc(m.model)}</b></div><div class="small muted mine" style="margin-top:8px">Lần trước: ${esc(m.mine||'(bỏ trống)')}</div></div>`;
   foot=`<div class="small muted" style="text-align:center">Bạn tự chấm: câu vừa viết đúng ý và đúng ngữ pháp chưa?</div><div class="grades" style="grid-template-columns:1fr 1fr"><button class="btn peach" data-g="0">Chưa đúng</button><button class="btn" data-g="1">Đúng rồi</button></div>`}
  return paint(body,foot)}
 const w=S.words.find(x=>x.id===item.wid),s=w.s[item.si];
 const hint=s?`<div class="row">${spk(s.en)}<span class="small muted">${esc(s.vi)}</span></div>`:'';
 if(item.type==='flip'){
  body=`<div class="kind">${item.nw?'Từ mới':'Lật thẻ'} · Bạn có nhớ nghĩa không?</div><div class="card flip pop">${item.nw?'<span class="pill" style="background:#fff">Mới</span>':''}<div class="w">${esc(w.w)}</div>${spk(w.w)}${item.state!=='ask'?`<div class="disp" style="font-size:24px">${esc(w.vi)}</div>${w.pos?`<div class="small">${esc(w.pos)}</div>`:''}`:''}</div>${item.state!=='ask'&&s?`<div class="card"><div class="row">${spk(s.en)}<div><b>${esc(s.en)}</b><div class="small muted">${esc(s.vi)}</div></div></div></div>`:''}`;
  foot=item.state==='ask'?`<button class="btn wide lav" data-act="reveal">Lật thẻ</button>`:item.nw?`<button class="btn wide" data-g="1">Đã hiểu, học tiếp</button>`:`<div class="grades"><button class="btn peach" data-g="0">Quên</button><button class="btn" data-g="1">Nhớ</button><button class="btn sky" data-g="2">Dễ</button></div>`}
 else if(item.type==='mc'){
  body=`<div class="kind">Chọn cụm từ đúng điền vào chỗ trống</div><div class="q">${blankify(s.en,s.ans)}</div><div class="small muted">${esc(s.vi)}</div><div class="opts">${item.opts.map((o,i)=>`<button class="btn ghost opt ${item.sel===i?'sel':''}" data-o="${i}" ${item.state!=='ask'?'disabled':''}>${esc(o)}</button>`).join('')}</div>`;
  foot=item.state==='ask'?`<button class="btn wide" data-act="check" ${item.sel===undefined?'disabled':''}>Kiểm tra</button>`:''}
 else if(item.type==='cloze'){
  body=`<div class="kind">Gõ cụm từ còn thiếu</div><div class="q">${blankify(s.en,s.ans)}</div><div class="small muted">${esc(s.vi)}</div><div class="small muted">Gợi ý: <b>${esc(w.w)}</b> → bắt đầu bằng “${esc(s.ans.slice(0,1))}”, ${s.ans.split(' ').length} từ</div><input id="ta" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án…" value="${esc(item.val||'')}" ${item.state!=='ask'?'disabled':''}>`;
  foot=item.state==='ask'?`<button class="btn wide" data-act="check">Kiểm tra</button>`:''}
 else if(item.type==='recall'){
  body=`<div class="kind">Nhìn nghĩa, gõ từ tiếng Anh</div><div class="card flip" style="min-height:150px"><div class="disp" style="font-size:28px">${esc(w.vi)}</div>${w.pos?`<div class="small">${esc(w.pos)}</div>`:''}</div><input id="ta" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ từ tiếng Anh…" value="${esc(item.val||'')}" ${item.state!=='ask'?'disabled':''}>`;
  foot=item.state==='ask'?`<button class="btn wide" data-act="check">Kiểm tra</button>`:''}
 else if(item.type==='order'){
  body=`<div class="kind">Xếp các từ thành câu tiếng Anh</div><div class="q" style="font-size:19px">${esc(s.vi)}</div><div class="tiles ans" id="built">${item.built.map((ti,k)=>`<button class="tile" data-b="${k}" ${item.state!=='ask'?'disabled':''}>${esc(item.toks[ti].t)}</button>`).join('')}</div><div class="tiles">${item.sh.map(x=>`<button class="tile ${item.built.includes(x.i)?'used':''}" data-t="${x.i}" ${item.state!=='ask'?'disabled':''}>${esc(x.t)}</button>`).join('')}</div>`;
  foot=item.state==='ask'?`<button class="btn wide" data-act="check" ${item.built.length!==item.toks.length?'disabled':''}>Kiểm tra</button>`:''}
 else if(item.type==='trans'){
  body=`<div class="kind">Dịch sang tiếng Anh · nhớ dùng <b>${esc(w.w)}</b></div><div class="q">${esc(s.vi)}</div><textarea id="ta" placeholder="Viết câu tiếng Anh…" ${item.state!=='ask'?'disabled':''}>${esc(item.val||'')}</textarea>`;
  if(item.state==='ask')foot=`<button class="btn wide" data-act="check">Xem câu mẫu</button>`;
  else{const has=keyHit(item.val,s.ans||w.w);
   body+=`<div class="keys"><span class="key ${has?'y':'n'}">${has?'✓ Đã dùng':'✗ Chưa thấy'} “${esc(s.ans||w.w)}”</span></div><div class="card"><div class="small muted">Câu mẫu</div><div class="row" style="margin-top:6px">${spk(s.en)}<b>${esc(s.en)}</b></div></div>`;
   foot=`<div class="small muted" style="text-align:center">Bạn tự chấm câu của mình</div><div class="grades"><button class="btn peach" data-g="0">Sai</button><button class="btn" data-g="1">Đúng</button><button class="btn sky" data-g="2">Hoàn hảo</button></div>`}}
 if(item.state==='fb'){const ok=item.ok;
  const right=item.type==='recall'?w.w:item.type==='order'?s.en:s.ans;
  foot=`<div class="fb ${ok?'ok':'bad'} pop"><b>${ok?(item.near?'Gần đúng rồi!':pick(['Chuẩn luôn!','Giỏi quá!','Tuyệt vời!'])):'Chưa đúng rồi'}</b>${!ok||item.near?`Đáp án: <b>${esc(right)}</b>`:''}${s?`<div class="row" style="margin-top:8px">${spk(s.en)}<span>${esc(s.en)}</span></div>`:''}</div><button class="btn wide ${ok?'':'peach'}" data-act="next">Tiếp tục</button>`}
 paint(body,foot)}
function paint(body,foot){openOv(head()+`<div class="ovbody">${body}</div><div class="foot"><div class="in">${foot}</div></div>`);const ta=$('#ta');if(ta&&!ta.disabled)ta.focus({preventScroll:true})}
function keyHit(txt,key){const t=' '+norm(txt)+' ';return norm(key).split(' ').filter(x=>x.length>2).every(k=>t.includes(k.replace(/(ing|ed|es|s)$/,'')))}
function check(){const item=sess.items[sess.i];const ta=$('#ta');if(ta)item.val=ta.value;
 if(item.type==='mis'||item.type==='trans'){item.state='self';drawItem();return}
 const w=S.words.find(x=>x.id===item.wid),s=w.s[item.si];let ok=false,near=false;
 if(item.type==='mc')ok=norm(item.opts[item.sel])===norm(s.ans);
 else if(item.type==='order')ok=norm(item.built.map(i=>item.toks[i].t).join(' '))===norm(s.en);
 else{const target=item.type==='recall'?w.w:s.ans;const a=norm(item.val),b=norm(target);ok=a===b;if(!ok&&b.length>=5&&lev(a,b)<=1){ok=true;near=true}}
 item.ok=ok;item.near=near;item.state='fb';beep(ok);grade(item,ok?1:0,true);drawItem()}
function grade(item,g,auto){if(item.graded)return;item.graded=true;const t=today(),L=logT();
 if(item.mid){const m=S.mistakes.find(x=>x.id===item.mid);if(g>0){m.streak++;if(m.streak>=2){m.ok=true;S.stats.fixed=(S.stats.fixed||0)+1}else m.due=t+2}else{m.streak=0;m.due=t+1}
  sess.graded++;if(g>0)sess.right++;save();return}
 const w=S.words.find(x=>x.id===item.wid);if(!w)return;
 if(item.si>=0&&w.s[item.si])w.s[item.si].used++;w.last=item.type;
 if(item.retry){save();return}
 if(item.nw){w.intro=true;L.nw++;sess.newCount++;
  // new word: show it once more later in session as an exercise
  sess.items.splice(Math.min(sess.items.length,sess.i+3),0,{wid:w.id,retry:false,learnStep:true});save();return}
 L.rev++;sess.graded++;if(g>0)sess.right++;
 if(g===0){w.lapses++;w.ease=Math.max(1.3,w.ease-.2);w.reps=Math.max(0,w.reps-1);w.ivl=1}
 else{if(item.learnStep||w.reps===0)w.ivl=g===2?3:1;else if(w.reps===1)w.ivl=g===2?6:3;else w.ivl=Math.round(w.ivl*w.ease*(g===2?1.3:1));if(g===2)w.ease=Math.min(3,w.ease+.1);w.reps++}
 w.due=t+w.ivl;
 if(g===0)sess.items.splice(Math.min(sess.items.length,sess.i+3),0,{wid:w.id,retry:true});
 save()}
function selfGrade(g){const item=sess.items[sess.i];
 if(item.type==='trans'&&g===0){const w=S.words.find(x=>x.id===item.wid),s=w.s[item.si];S.mistakes.push({id:uid(),vi:s.vi,mine:item.val||'',model:s.en,wid:w.id,due:today()+1,streak:0,ok:false})}
 grade(item,g,false);if(item.type!=='flip')beep(g>0);sess.i++;nextItem()}
function finish(){const L=logT();const avail=sess.total;if(L.rev+L.nw>=Math.min(5,avail)||sess.i>=sess.items.length)L.done=true;
 S.stats.sessions=(S.stats.sessions||0)+1;save();
 const pc=sess.graded?Math.round(sess.right/sess.graded*100):100;
 openOv(`<div class="ovbody" style="justify-content:center;text-align:center;align-items:center;min-height:100%">${mascot(...curMascot())}<h1>Xong buổi ôn!</h1><p class="muted">${sess.graded} lượt ôn · đúng ${pc}% · ${sess.newCount} từ mới</p><p><b>Chuỗi ${streak()} ngày</b></p><button class="btn wide" style="max-width:360px" data-act="close">Về trang chủ</button></div>`);
 confetti();sess=null;setTimeout(checkStickers,900)}

/* ---------- paragraph ---------- */
let pv=null;
function paraView(){const p=todayPara();if(!p)return;pv={id:p.id,vals:p.vi.map(()=>''),checked:false,g:p.vi.map(()=>null)};drawPara()}
function drawPara(){const p=S.paras.find(x=>x.id===pv.id);
 const rows=p.vi.map((v,i)=>{const k=(p.k&&p.k[i])||[];let extra='';
  if(pv.checked){extra=`<div class="keys">${k.map(x=>{const h=keyHit(pv.vals[i],x);return`<span class="key ${h?'y':'n'}">${h?'✓':'✗'} ${esc(x)}</span>`}).join('')}</div><div class="row">${spk(p.en[i]||'')}<b>${esc(p.en[i]||'')}</b></div><div class="grades" style="grid-template-columns:1fr 1fr"><button class="btn ${pv.g[i]===0?'peach':'ghost'}" data-pg="${i}:0">Sai</button><button class="btn ${pv.g[i]===1?'':'ghost'}" data-pg="${i}:1">Đúng</button></div>`}
  return`<div class="psent"><div><span class="pill" style="background:var(--lav)">Câu ${i+1}</span> <b>${esc(v)}</b></div>${k.length&&!pv.checked?`<div class="small muted">Gợi ý dùng: ${k.map(esc).join(', ')}</div>`:''}<textarea data-pi="${i}" style="min-height:70px" placeholder="Dịch câu ${i+1}…" ${pv.checked?'disabled':''}>${esc(pv.vals[i])}</textarea>${extra}</div>`}).join('');
 const allG=pv.g.every(x=>x!==null);
 openOv(`<div class="ovhead"><button class="iconbtn" data-act="close" aria-label="Đóng">✕</button><h3 style="flex:1">${esc(p.title)}</h3>${pv.checked?`<button class="spk" data-say="${esc(p.en.join(' '))}" aria-label="Nghe cả đoạn">${SPK}</button>`:''}</div>
<div class="ovbody"><div class="kind">Dịch đoạn sang tiếng Anh, từng câu một</div>${rows}</div>
<div class="foot"><div class="in">${pv.checked?`<button class="btn wide" data-act="parafinish" ${allG?'':'disabled'}>${allG?'Hoàn tất':'Tự chấm từng câu để hoàn tất'}</button>`:`<button class="btn wide lav" data-act="paracheck">So với bản mẫu</button>`}</div></div>`)}
function paraFinish(){const p=S.paras.find(x=>x.id===pv.id);
 p.vi.forEach((v,i)=>{if(pv.g[i]===0)S.mistakes.push({id:uid(),vi:v,mine:pv.vals[i],model:p.en[i]||'',due:today()+1,streak:0,ok:false})});
 p.done=today();p.mine=pv.vals;S.stats.paras=(S.stats.paras||0)+1;const L=logT();L.para++;L.done=true;save();
 const ok=pv.g.filter(x=>x===1).length;pv=null;
 openOv(`<div class="ovbody" style="justify-content:center;text-align:center;align-items:center;min-height:100%">${mascot('lav','glasses')}<h1>Dịch xong rồi!</h1><p class="muted">Đúng ${ok}/${p.vi.length} câu. Câu sai đã vào Sổ lỗi để ôn lại.</p><button class="btn wide" style="max-width:360px" data-act="close">Về trang chủ</button></div>`);
 confetti();setTimeout(checkStickers,900)}

/* ---------- stickers / fx ---------- */
function checkStickers(){const nw=STICKERS.find(s=>!S.stickers[s.id]&&stv(s.k)>=s.n);if(!nw)return;S.stickers[nw.id]=today();save();
 const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card pop">${mascot(nw.c,nw.a)}<div class="small muted">Sticker mới!</div><h2>${esc(nw.name)}</h2><p class="muted">${esc(nw.d)}</p><div class="row" style="justify-content:center">${spk(nw.cheer)}<b>${esc(nw.cheer)}</b></div><button class="btn wide" style="margin-top:14px" data-act="closemodal">Dán vào album</button></div>`;
 document.body.appendChild(m);confetti()}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('div');c.className='conf';const cols=Object.values(COLORS).map(x=>x[0]);
 c.innerHTML=Array.from({length:60},()=>`<i style="left:${Math.random()*100}%;background:${pick(cols)};animation-delay:${Math.random()*.5}s;animation-duration:${1.4+Math.random()}s"></i>`).join('');document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}
let actx=null;
function beep(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type='sine';const t=actx.currentTime;
 o.frequency.setValueAtTime(ok?660:300,t);if(ok)o.frequency.setValueAtTime(880,t+.09);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.26)}catch(e){}}

/* ---------- events ---------- */
let delArm=null,resetArm=false;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.say!==undefined){e.preventDefault();e.stopPropagation();say(d.say);return}
 if(d.t&&b.classList.contains('tab')){tab=d.t;render();scrollTo(0,0);return}
 if(d.f){filt=d.f;render();return}
 if(d.edit){wordForm(d.edit);return}
 if(d.save!==undefined){saveWord(d.save);return}
 if(d.del){if(delArm===d.del){S.words=S.words.filter(w=>w.id!==d.del);save();delArm=null;render();toast('Đã xóa')}else{delArm=d.del;b.textContent='Bấm lần nữa để xóa'}return}
 if(d.o!==undefined){sess.items[sess.i].sel=+d.o;drawItem();return}
 if(d.t!==undefined&&b.classList.contains('tile')){const it=sess.items[sess.i];it.built.push(+d.t);drawItem();return}
 if(d.b!==undefined){const it=sess.items[sess.i];it.built.splice(+d.b,1);drawItem();return}
 if(d.g!==undefined){selfGrade(+d.g);return}
 if(d.pg){const [i,g]=d.pg.split(':').map(Number);pv.g[i]=g;drawPara();return}
 const a=d.act;if(!a)return;
 if(a==='review')startReview();
 else if(a==='para')paraView();
 else if(a==='import')importView();
 else if(a==='doimport')doImport();
 else if(a==='copyprompt')copy(PROMPT);
 else if(a==='more')copy(morePrompt());
 else if(a==='add')wordForm(null);
 else if(a==='settings')settingsView();
 else if(a==='close'){pv=null;closeOv()}
 else if(a==='quit'){closeOv();toast('Đã lưu tiến độ')}
 else if(a==='check')check();
 else if(a==='next'){sess.i++;nextItem()}
 else if(a==='reveal'){sess.items[sess.i].state='self';drawItem()}
 else if(a==='paracheck'){document.querySelectorAll('[data-pi]').forEach(t=>pv.vals[+t.dataset.pi]=t.value);pv.checked=true;drawPara()}
 else if(a==='parafinish')paraFinish();
 else if(a==='closemodal'){b.closest('.modal').remove();render();setTimeout(checkStickers,300)}
 else if(a==='savesettings'){S.settings.newPerDay=Math.max(1,+$('#sn').value||8);S.settings.maxRev=Math.max(10,+$('#sr').value||60);S.settings.rate=+$('#sp').value||.9;save();toast('Đã lưu cài đặt')}
 else if(a==='backup')copy(JSON.stringify(S));
 else if(a==='restore'){try{const x=JSON.parse($('#rs').value);if(!x.words)throw 0;S=Object.assign(blankState(),x);save();closeOv();toast('Đã khôi phục')}catch(err){toast('Bản sao lưu không hợp lệ')}}
 else if(a==='reset'){if(!resetArm){resetArm=true;b.textContent='Chắc chưa? Bấm lần nữa để xóa hết';return}S=blankState();save();resetArm=false;closeOv();toast('Đã xóa toàn bộ')}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='search'){q=t.value;const pos=t.selectionStart;render();const s=$('#search');s.focus();try{s.setSelectionRange(pos,pos)}catch(x){}}
 if(t.id==='sp')$('#spv').textContent=t.value;
 if(t.dataset&&t.dataset.pi!==undefined&&pv)pv.vals[+t.dataset.pi]=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.id==='ta'){e.preventDefault();check()}});
render();
}
</script>
</body>

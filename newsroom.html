<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newsroom · Nora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning, sister tab of Lumora English, same family as My Life Dashboard
   IDEA a board-game map: one stepping stone per day of news along a winding road, gifts every 7 days
   PICTURE the season scene with the road, numbered stones, stars, locks, gift boxes and the mascot on today's stone
   COLOUR dashboard palette: dotted #FFF5FA ground, ink #4A3856, pastel tints with deep accents; scene tinted by season
   TYPE Baloo 2 display + Nunito text
   LAYOUT phone: title row, tall vertical map that scrolls; laptop: horizontal map band across the top, stats beside */
:root{color-scheme:light;
--bg:#FFF5FA;--card:#FFFFFF;--ink:#4A3856;--soft:#8A7896;--line:#F1DCEA;--brand:#E0588C;
--pink:#FFDDEA;--pinkD:#E0588C;--mint:#D3F4E4;--mintD:#2A9A6E;--sky:#D7EAFF;--skyD:#3B7DD6;
--butter:#FFF2C4;--butterD:#A87900;--lav:#E9DEFF;--lavD:#7A58D6;--peach:#FFE3D1;--peachD:#CC6830}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--line) 1.5px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:"Baloo 2",Nunito,system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,6vw,40px);color:var(--brand);font-weight:800}h2{font-size:26px;color:var(--lavD)}h3{font-size:20px;color:var(--lavD)}
.wrap{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 110px}
.muted{color:var(--soft)}.small{font-size:13px}
.card{background:var(--card);border-radius:22px;border:2px solid var(--line);padding:18px;box-shadow:0 4px 0 rgba(74,56,86,.06)}
.btn{--cd:var(--mintD);font:800 16px/1 Nunito,system-ui,sans-serif;border:0;border-radius:99px;padding:14px 20px;min-height:50px;cursor:pointer;color:#fff;background:var(--cd);box-shadow:0 4px 0 color-mix(in srgb,var(--cd) 70%,#000);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:translateY(3px)}
.btn.pink{--cd:var(--pinkD)}.btn.lav{--cd:var(--lavD)}.btn.sky{--cd:var(--skyD)}.btn.peach{--cd:var(--peachD)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}.btn.wide{width:100%}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.spk:focus-visible,.iconbtn:focus-visible,.step:focus-visible{outline:3px solid var(--lavD);outline-offset:3px}
.spk{border:0;background:var(--sky);color:var(--skyD);width:40px;height:40px;border-radius:50%;cursor:pointer;flex:none;display:inline-grid;place-items:center}
.spk svg{width:20px;height:20px}
.iconbtn{border:2px solid var(--line);background:var(--card);color:var(--lavD);border-radius:50%;width:46px;height:46px;cursor:pointer;display:grid;place-items:center;font:800 18px Nunito,sans-serif;flex:none}
input,textarea{font:16px/1.4 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--lavD)}
textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
.pill{font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:rgba(255,255,255,.85);color:var(--soft);border-radius:99px;padding:8px 14px;font:800 14px Nunito,sans-serif;cursor:pointer;min-height:40px}
.chip.on{background:var(--lavD);color:#fff}
/* home */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;margin-bottom:14px}
.top .date{color:var(--lavD);font-weight:800;font-size:14px}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini span{border-radius:16px;padding:8px 12px;font-weight:800;font-size:13px;color:var(--soft)}
.mini b{font:800 22px/1 "Baloo 2",sans-serif;display:block}
.m1{background:var(--butter)}.m1 b{color:var(--butterD)}.m2{background:var(--mint)}.m2 b{color:var(--mintD)}.m3{background:var(--lav)}.m3 b{color:var(--lavD)}
.mapcard{padding:0;overflow:hidden;position:relative}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap;position:relative;z-index:2}
.mapbox{position:relative;overflow:auto;-webkit-overflow-scrolling:touch}
.mapbox svg{display:block}
.mapbox.h{height:400px}
.today{margin-top:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--pink);border:0}
.today .mas{width:76px;height:76px}
.today h3{color:var(--pinkD)}
.node{cursor:pointer}
.node:focus-visible .top-e{stroke:var(--lavD);stroke-width:4}
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
.giftb{animation:gb 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes gb{50%{transform:translateY(-6px) rotate(-4deg)}}
.flake{position:absolute;top:-10px;pointer-events:none;animation:fl linear infinite;opacity:.8}
@keyframes fl{to{transform:translate(30px,820px) rotate(300deg)}}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,245,250,.92);backdrop-filter:blur(6px);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{border:0;background:none;color:var(--soft);font:800 13px Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:16px;cursor:pointer;min-height:54px}
.tab svg{width:26px;height:26px}
.tab.on{color:#fff;background:var(--cd)}
#t-map{--cd:var(--pinkD)}#t-words{--cd:var(--mintD)}#t-mist{--cd:var(--peachD)}#t-closet{--cd:var(--lavD)}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.term{font:800 20px/1.15 "Baloo 2",Nunito,sans-serif}
.closet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.closet .card{text-align:center;padding:14px 10px}
.closet .mas{width:96px;height:96px;margin:0 auto}
.closet .lock .mas{opacity:.3;filter:grayscale(1)}
.closet .wear{border-color:var(--lavD);background:var(--lav)}
/* lesson overlay */
.ov{position:fixed;inset:0;background-color:var(--bg);background-image:radial-gradient(var(--line) 1.5px,transparent 1.6px);background-size:22px 22px;z-index:10;display:flex;flex-direction:column;overflow:auto}
.ovhead{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;max-width:780px;width:100%;margin:0 auto}
.ovbody{flex:1;max-width:780px;width:100%;margin:0 auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:14px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step{border:2px solid var(--line);background:var(--card);color:var(--soft);border-radius:16px;padding:6px 4px;font:800 14px/1.15 Nunito,sans-serif;cursor:pointer;min-height:52px}
.step.s4{--cd:var(--lavD)}.step.s3{--cd:var(--peachD)}
.pop{background:var(--butter);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:15px}
.w-ok{background:var(--mint);color:var(--mintD);border-radius:6px;padding:1px 4px;font-weight:700}
.w-bad{background:var(--pink);color:var(--pinkD);border-radius:6px;padding:1px 4px;font-weight:800}
.dres{margin-top:10px}
.step.on{background:var(--cd);color:#fff;border-color:var(--cd)}
.step.s1{--cd:var(--skyD)}.step.s2{--cd:var(--mintD)}
.sent{display:flex;gap:10px;align-items:flex-start}
.sent p{margin:0}
.en{font:700 18px/1.55 Nunito,sans-serif}
.hl{background:linear-gradient(transparent 58%,var(--butter) 58%);border-radius:3px;cursor:pointer;font-weight:800}
.vi{color:var(--soft);margin-top:6px!important}
.src{font-size:13px;color:var(--soft)}
.src a{color:var(--skyD);font-weight:800}
.vcard .head{display:flex;gap:10px;align-items:center}
.vcard p{margin:6px 0 0}
.ex{background:var(--sky);border-radius:14px;padding:10px 12px;margin-top:10px}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-size:13px;font-weight:800;border-radius:99px;padding:4px 10px}
.key.y{background:var(--mint);color:var(--mintD)}.key.n{background:var(--pink);color:var(--pinkD)}
.psent{display:grid;gap:8px;padding:14px 0;border-top:2px dashed var(--line)}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mine{text-decoration:line-through;text-decoration-color:var(--pinkD)}
.foot{position:sticky;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,245,250,.95);border-top:2px solid var(--line)}
.foot .in{max-width:780px;margin:0 auto;display:grid;gap:10px}
.modal{position:fixed;inset:0;background:rgba(74,56,86,.4);z-index:20;display:grid;place-items:center;padding:16px}
.modal .card{max-width:420px;width:100%;text-align:center}
.modal .mas{width:150px;height:150px;margin:0 auto}
.conf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{50%{transform:translateY(-5px)}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;z-index:40;max-width:90vw;text-align:center}
@media(prefers-reduced-motion:reduce){.bob,.pulse,.giftb,.flake,.conf i{animation:none}}
@media(max-width:600px){.top{grid-template-columns:1fr}.today{grid-template-columns:auto minmax(0,1fr)}.today .btn{grid-column:1/-1}.en{font-size:17px}}
.appnav{position:sticky;top:0;z-index:8;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px);background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-bottom:2px solid rgba(0,0,0,.05)}.appnav a{font:700 14px/1 "Nunito","Be Vietnam Pro",system-ui,sans-serif;text-decoration:none;color:#8A7896;padding:10px 16px;border-radius:99px;min-height:40px;display:inline-flex;align-items:center}.appnav a.on{color:#fff;background:#E0588C}.appnav a.on.x{background:#1F6B32}#syncbar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;font:700 13px/1.3 Nunito,system-ui,sans-serif;color:var(--soft);padding:6px 12px}#syncbar button{border:0;background:none;color:var(--lavD);font:800 13px Nunito,sans-serif;text-decoration:underline;cursor:pointer;padding:6px}</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>
<nav class="appnav"><a href="./" class="">Excel</a><a href="english.html" class="">Từ vựng</a><a href="newsroom.html" class="on ">Newsroom</a></nav>
<div class="wrap" id="app"></div>
<nav class="tabs">
<button class="tab on" id="t-map" data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Lộ trình</button>
<button class="tab" id="t-words" data-tab="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h6"/></svg>Sổ từ</button>
<button class="tab" id="t-mist" data-tab="mist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Sổ lỗi</button>
<button class="tab" id="t-closet" data-tab="closet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 12h18M12 8v13M7.5 8C6 8 5 6.5 6 5s3.5-.5 6 3c2.5-3.5 5-4.5 6-3s0 3-1.5 3"/></svg>Tủ đồ</button>
</nav>
<div id="ov"></div>
<script>
{
/* Bài mẫu: hai tin có thật, viết lại bằng giọng báo chí. Bản thật sẽ đọc file news/*.json trong repo lumora. */
/* Bài tin nằm trong thư mục news/: index.json là danh sách ngày, mỗi ngày một file YYYY-MM-DD.json. */
let NEWS=[];
const ACCS=[
{id:'scarf',name:'Khăn len',c:'mint'},{id:'beanie',name:'Mũ len',c:'sky'},{id:'bow',name:'Nơ hồng',c:'peach'},{id:'glasses',name:'Kính tròn',c:'lav'},
{id:'flower',name:'Hoa cài',c:'pink'},{id:'cap',name:'Mũ tốt nghiệp',c:'lav'},{id:'star',name:'Sao may mắn',c:'butter'},{id:'crown',name:'Vương miện',c:'butter'}];
const COL={peach:['#ffb59e','#e98c70'],mint:['#8fe3c6','#4fbf98'],butter:['#ffe07a','#e6bb3a'],lav:['#c7b3ff','#9a80ea'],sky:['#9fd3ff','#5fa9e6'],pink:['#ff9fc9','#e66ea4']};
const THEMES={
autumn:{name:'Thu',sky:['#FFE9DC','#FFF5FA'],road:'#FFE3D1',edge:'#F3C3A6',stone:'#E9DEFF',stoneD:'#B9A6E6'},
snow:{name:'Đông',sky:['#DDEBFF','#F6FAFF'],road:'#D7EAFF',edge:'#A9CBF2',stone:'#E3E6FF',stoneD:'#9FA6E0'},
tet:{name:'Tết',sky:['#FFE0EA','#FFF8E6'],road:'#FFF2C4',edge:'#F0D684',stone:'#FFDDEA',stoneD:'#E6A0BC'}};
const KEY='lumoraNews.v1';
const iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return x.toISOString().slice(0,10)};
const TODAY=iso(new Date());
const dnum=s=>Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5);
const dstr=n=>new Date(n*864e5).toISOString().slice(0,10);
let ORDER=[];const fmt=s=>String(ORDER.indexOf(s)+1);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'%$. ]+/g,' ').replace(/\s+/g,' ').trim();
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uid=()=>Math.random().toString(36).slice(2,9);
function keyHit(txt,key){const t=' '+norm(txt)+' ';return norm(key.replace('…',' ')).split(' ').filter(x=>x.length>2).every(k=>t.includes(k.replace(/(ing|ed|es|s)$/,'')))}

const blankNews=()=>({done:{},words:[],mistakes:[],accs:[],wear:'',gifts:{},fixed:0});
let S=blankNews();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const saveRaw=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{S.updated=Date.now();saveRaw();if(typeof SYNC!=='undefined')SYNC.push()};
let tab='map',theme=null,lv=null,q='';
const monthTheme=()=>{const m=+TODAY.slice(5,7);return m===12?'snow':(m<=2?'tet':'autumn')};

/* speech */
let voice=null;const pv=()=>{try{const v=speechSynthesis.getVoices().filter(x=>/^en[-_]US/i.test(x.lang));voice=v.find(x=>/Samantha|Google US|Aria|Jenny/i.test(x.name))||v[0]||null}catch(e){}};
try{pv();speechSynthesis.onvoiceschanged=pv}catch(e){}
function say(t,r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=r||.9;speechSynthesis.speak(u)}catch(e){toast('Máy chưa hỗ trợ đọc phát âm')}}
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const spk=t=>`<button class="spk" data-say="${esc(t)}" aria-label="Nghe">${SPK}</button>`;

/* mascot */
function acc(a){switch(a){
case'bow':return'<path d="M44 26c-10-10-22-4-18 6 3 7 14 5 18 0 4 5 15 7 18 0 4-10-8-16-18-6z" fill="#ff7fb6"/><circle cx="44" cy="27" r="5" fill="#e65597"/>';
case'glasses':return'<g fill="none" stroke="#4A3856" stroke-width="4"><circle cx="47" cy="62" r="11"/><circle cx="73" cy="62" r="11"/><path d="M58 61h4"/></g>';
case'star':return'<path d="M86 22l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" fill="#ffd23f" stroke="#e6a800" stroke-width="2"/>';
case'scarf':return'<path d="M28 86c18 10 46 10 64 0v10c-18 9-46 9-64 0z" fill="#ff8f70"/><path d="M78 92l6 24h-10l-2-22z" fill="#ff8f70"/><path d="M34 90h4M46 94h4M58 95h4M70 94h4" stroke="#fff" stroke-width="3"/>';
case'beanie':return'<path d="M24 40c2-22 70-22 72 0z" fill="#5fa9e6"/><rect x="22" y="36" width="76" height="10" rx="5" fill="#9fd3ff"/><circle cx="60" cy="14" r="7" fill="#fff"/>';
case'flower':return'<g transform="translate(84 30)"><circle r="6" cy="-8" fill="#ff9fc9"/><circle r="6" cx="8" fill="#ff9fc9"/><circle r="6" cy="8" fill="#ff9fc9"/><circle r="6" cx="-8" fill="#ff9fc9"/><circle r="5" fill="#ffe07a"/></g>';
case'cap':return'<path d="M22 30l38-14 38 14-38 14z" fill="#4A3856"/><path d="M40 37v10c12 6 28 6 40 0V37l-20 7z" fill="#5d4a70"/><path d="M92 32v16" stroke="#ffd23f" stroke-width="3"/><circle cx="92" cy="50" r="4" fill="#ffd23f"/>';
case'crown':return'<path d="M36 34l6-20 10 12 8-16 8 16 10-12 6 20z" fill="#ffd23f" stroke="#e6a800" stroke-width="2.5" stroke-linejoin="round"/><circle cx="60" cy="27" r="3" fill="#ff7fb6"/>';
default:return''}}
function blob(c,a){const [f,d]=COL[c]||COL.pink;return`<ellipse cx="60" cy="112" rx="34" ry="6" fill="#4A3856" opacity=".12"/><g class="bob"><path d="M60 20c28 0 44 22 44 52 0 26-18 38-44 38S16 98 16 72c0-30 16-52 44-52z" fill="${f}"/><path d="M60 110c-26 0-44-12-44-38 0-6 1-12 2-17 4 26 22 40 42 40s38-14 42-40c1 5 2 11 2 17 0 26-18 38-44 38z" fill="${d}" opacity=".45"/><ellipse cx="44" cy="40" rx="10" ry="6" fill="#fff" opacity=".55" transform="rotate(-25 44 40)"/><circle cx="47" cy="62" r="6" fill="#4A3856"/><circle cx="73" cy="62" r="6" fill="#4A3856"/><circle cx="49" cy="60" r="2" fill="#fff"/><circle cx="75" cy="60" r="2" fill="#fff"/><ellipse cx="36" cy="74" rx="7" ry="4" fill="#ff7fb6" opacity=".5"/><ellipse cx="84" cy="74" rx="7" ry="4" fill="#ff7fb6" opacity=".5"/><path d="M53 75q7 7 14 0" stroke="#4A3856" stroke-width="3.5" fill="none" stroke-linecap="round"/>${acc(a)}</g>`}
const mascot=(c,a)=>`<svg class="mas" viewBox="0 0 120 120" aria-hidden="true">${blob(c,a)}</svg>`;

/* data helpers */
const byDate={};
function nodes(){const cur=ORDER.findIndex(d=>!S.done[d]);const total=Math.ceil((ORDER.length+15)/14)*14;const out=[];
 for(let i=0;i<total;i++){const d=ORDER[i]||null,dn=d&&S.done[d];out.push({d,i,st:dn?'done':(i===cur?'cur':'lock'),stars:dn?dn.stars:0})}return out}
const doneCount=()=>Object.keys(S.done).length;

/* map */
let ro=null;

 terms.forEach(t=>{const re=new RegExp('\\b('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s+')+'\\w*)','i');s=s.replace(re,(m)=>m.includes('class="hl"')?m:`<span class="hl" data-term="${esc(t)}">${m}</span>`)});return s}

function diff(orig,typed){const a=tok(orig),b=tok(typed).map(nt).filter(Boolean),A=a.map(nt);const m=A.length,n=b.length;const L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
 for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=A[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 const ok=new Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(A[i]===b[j]){ok[i]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
 return{html:a.map((w,k)=>`<span class="${ok[k]?'w-ok':'w-bad'}">${esc(w)}</span>`).join(' '),score:Math.round(ok.filter(Boolean).length/m*100)}}

 else if(lv.step===2){body=n.vocab.map(v=>{const saved=S.words.some(w=>w.t===v.t);return`<div class="card vcard"><div class="head"><div class="grow"><div class="term">${esc(v.t)}</div><div class="muted">${esc(v.vi)}</div></div><span class="pill" style="background:${v.k==='Thành ngữ'?'var(--pink)':v.k==='Từ'?'var(--sky)':'var(--mint)'};color:var(--ink)">${esc(v.k)}</span>${spk(v.t)}</div><p class="small">${esc(v.note)}</p><div class="ex"><div class="row">${spk(v.ex)}<div><b>${esc(v.ex)}</b><div class="small muted">${esc(v.exVi)}</div></div></div></div><div style="margin-top:10px"><button class="btn ${saved?'ghost':''}" style="min-height:42px;padding:10px 16px" data-save="${esc(v.t)}">${saved?'Đã lưu ✓':'Lưu vào sổ'}</button></div></div>`}).join('');

 else{body=`<div class="small muted">Dịch từng câu tiếng Việt quay lại tiếng Anh, cố dùng đúng các cụm từ của bài. Xong rồi so với câu gốc và tự chấm.</div>`+n.vi.map((v,i)=>{const k=n.k[i]||[];let extra='';

    doc.onSnapshot(s=>{const d=s.data();if(!d||s.metadata.hasPendingWrites||!d.data)return;if((d.updated||0)>(A.get().updated||0)){if(A.busy()){pending=d;bar('Có dữ liệu mới từ máy khác, sẽ cập nhật khi bạn xong bài');return}adopt(d);bar('Đã đồng bộ')}})
   }).catch(e=>bar('Chưa đồng bộ được'+(e&&e.code?' ('+e.code+')':'')+' · vẫn lưu trên máy này'))})}
 return{init,push}})();
